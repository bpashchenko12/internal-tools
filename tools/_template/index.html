<!doctype html>
<html lang="en">
<head>
  <script src="../../assets/js/gate.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>My Tool · XMTrading Internal Tools</title>
  <link rel="stylesheet" href="../../assets/css/xm.css" />
  <link rel="stylesheet" href="tool.css" />
</head>
<body>
  <div id="hub-bar" data-title="My Tool"></div>

  <main class="page">
    <div class="page-head">
      <div>
        <div class="eyebrow">Category</div>
        <h1 class="h-l">My Tool</h1>
        <p>One sentence about what this tool does and who it is for.</p>
      </div>
      <button class="btn btn-primary" id="run" type="button">Primary action</button>
    </div>

    <div class="grid c3">
      <div class="card stat"><div class="k">Metric one</div><div class="v num">1,284</div><div class="d up">+12.4%</div></div>
      <div class="card stat"><div class="k">Metric two</div><div class="v num">96%</div><div class="d dn">-1.8%</div></div>
      <div class="card stat"><div class="k">Metric three</div><div class="v num">42</div><div class="d mut">No change</div></div>
    </div>

    <section class="card" style="margin-top:18px">
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th>Name</th><th>Status</th><th>Value</th></tr></thead>
          <tbody>
            <tr><td>Example row</td><td><span class="tag">Ready</span></td><td class="num">120</td></tr>
            <tr><td>Another row</td><td><span class="tag amber">Review</span></td><td class="num">87</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="../../assets/js/shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
